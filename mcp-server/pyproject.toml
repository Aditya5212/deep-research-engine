[project]
name = "mcp-server"
version = "0.1.0"
description = "Standalone Tavily MCP server with Streamable HTTP transport"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.0",
    "python-dotenv>=1.2.1",
    "tavily-python>=0.7.22",
    "uvicorn[standard]>=0.41.0",
]

[project.scripts]
# Run with: uv run start
start = "main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
